app = "cpd-hub-backend"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_ADDR = ":8080"
  APP_ENV = "production"
  AUTO_MIGRATE = "false"

[deploy]
  release_command = "/app/migrate -database \"$DATABASE_URL\" -dir /app/migrations up"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
